# API only — uses your Mac Postgres on localhost:5432 (no Compose Postgres).
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Prefer DOCKER_DATABASE_URL (host.docker.internal). Falls back to local world DB.
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg2://postgres:postgres@host.docker.internal:5432/world}
      JOB_APP_DATA_ROOT: /app/data
      CV_PREVIEW_DIR: /app/data/output/preview
      CV_CHROME_BIN: /usr/bin/chromium
      # Preload JobBERT + MiniLM at startup so Calculate score is not cold on first click
      MATCH_SCORE_WARMUP: "1"
      HF_HOME: /app/data/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/data/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  app_data:
